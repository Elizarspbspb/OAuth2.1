<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Банк-клиент (BFF + JS)</title>
</head>
<body>
    <h1>Личный кабинет клиента</h1>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    {% if is_authenticated %}
        <p>Вы успешно авторизованы! Токен надежно спрятан на сервере.</p>
        <button id="load-data-btn">Загрузить баланс через JS (API)</button>
        <pre id="api-output"></pre>

        <form action="/logout" method="post">
            <button type="submit">Выйти</button>
        </form>
    {% else %}
        <a href="/login"><button>Войти через Банк (OAuth 2.1)</button></a>
    {% endif %}

    <!-- Подключаем внешний JS-скрипт -->
    <!-- Браузер автоматически отправляет второй фоновый HTTP-запрос на сервер: GET /static/app.js. -->
    <script src="/static/app.js"></script>
</body>
</html>
