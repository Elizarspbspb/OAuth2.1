<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход в Банк ID (OAuth 2.1)</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 32px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 340px; }
        h2 { margin-top: 0; color: #1a1a1a; font-size: 22px; }
        .info { background: #f8f9fa; border-left: 4px solid #0066ff; padding: 12px; font-size: 13px; margin-bottom: 20px; color: #444; }
        .error { background: #fff2f0; border: 1px solid #ffccc7; color: #cf1322; padding: 10px; border-radius: 6px; font-size: 13px; margin-bottom: 15px; }
        label { font-size: 13px; font-weight: 600; color: #333; }
        input { width: 100%; padding: 10px; margin: 6px 0 16px; border: 1px solid #d9d9d9; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        button { width: 100%; padding: 12px; background: #0066ff; color: white; border: none; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; }
        button:hover { background: #0052cc; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Вход в систему</h2>
        
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <div class="info">
            Сервис <b>{{ client_id }}</b> запрашивает доступ к вашему аккаунту.<br>
            Запрошенные права: <b>{{ scope }}</b>
        </div>

        <!-- Отправляем POST на тот же URL с сохранением всех GET-параметров OAuth -->
        <form method="post">
            <label>Логин (alice или bob)</label>
            <input type="text" name="username" required placeholder="Введите логин">
            
            <label>Пароль (123 или 456)</label>
            <input type="password" name="password" required placeholder="Введите пароль">
            
            <button type="submit">Войти и подтвердить</button>
        </form>
    </div>
</body>
</html>
