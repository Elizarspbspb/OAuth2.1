server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Заголовки безопасности (теперь их ставит веб-сервер)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    # в connect-src обязаны явно разрешить браузеру ходить на порты 8000 и 8001!
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self' http://localhost:8000 http://localhost:8001;" always;

    location / {
        # В SPA все маршруты (например, /callback) отдают index.html, а дальше разбирается JS
        try_files $uri $uri/ /index.html;
    }
}