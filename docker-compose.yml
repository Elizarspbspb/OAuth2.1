services:
  # КОНТЕЙНЕР 1: База данных PostgreSQL
  auth_db:
    image: postgres:16-alpine
    container_name: auth_db
    environment:
      POSTGRES_USER: bank_admin
      POSTGRES_PASSWORD: secret_pass
      POSTGRES_DB: auth_db
    ports:
      - "5432:5432"
    volumes:
      - auth_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank_admin -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # КОНТЕЙНЕР 2: Сервер авторизации OAuth 2.1
  auth_server:
    build: 
      context: ./auth_server
      network: host
    container_name: auth_server
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://bank_admin:secret_pass@auth_db:5432/auth_db
    depends_on:
      auth_db:
        condition: service_healthy

  # КОНТЕЙНЕР 3: Сервер ресурсов (Банк API)
  resource_server:
    build: 
      context: ./resource_server
      network: host
    container_name: resource_server
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql+psycopg://bank_admin:secret_pass@auth_db:5432/auth_db
      JWKS_URL: http://auth_server:8000/.well-known/jwks.json
    depends_on:
      auth_server:
        condition: service_started

  # КОНТЕЙНЕР 4: Клиентское ПО
  client_app:
    build:
      context: ./client_app
      network: host
    container_name: client_app
    ports:
      - "8002:8002"
    environment:
      AUTH_PUBLIC_URL: http://localhost:8000
      AUTH_INTERNAL_URL: http://auth_server:8000
    depends_on:
      - auth_server
      - resource_server
      
  # КОНТЕЙНЕР 5: Клиентское SPA
  spa_client_app:
    build: 
      context: ./spa_client_app
      network: host
    container_name: spa_client_app
    ports:
      - "8003:80"
    depends_on:
      - auth_server
      - resource_server

volumes:
  auth_pg_data:
